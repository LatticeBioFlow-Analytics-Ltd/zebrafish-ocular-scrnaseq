name: CI

# Unlike the upstream cellranger-cellbender-workflow — where Cell Ranger is
# licence-gated and Linux-only, so CI can do nothing but lint and dry-run — this
# pipeline runs for real here. The test suite builds synthetic 10x matrices and
# takes them through QC, clustering, compartment assignment and both pass-2
# subsets, so a break in the analysis path fails on the pull request rather than
# four hours into a run on real data.
#
# No data is downloaded and no credentials are needed: every fixture is
# generated by tests/fixtures/make_synthetic_h5.py.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant. Integration
# is the slow job, so cancelling saves real minutes on a private repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `locked: true` is the point of committing pixi.lock at all. The README
      # claims `pixi install` reproduces the environment bit-for-bit rather than
      # re-solving it; if pyproject.toml gains a dependency and the lockfile is
      # not regenerated, that claim quietly stops being true. This fails instead.
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dev
          locked: true

      - name: Lint
        run: pixi run -e dev lint

      - name: Unit tests
        run: pixi run -e dev test

  integration:
    name: Full pipeline on synthetic data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dev
          locked: true

      # Separate job because it is slow — a couple of minutes rather than
      # seconds — and because a failure here means something different from a
      # unit-test failure: the pieces are individually correct but no longer
      # compose.
      - name: Integration tests
        run: pixi run -e dev integration

  configs:
    name: Configs parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dev
          locked: true

      # Two separate questions, and only one of them is answerable on a runner.
      #
      # `from_yaml` is the schema check: the config dataclasses are frozen and
      # take keyword arguments, so a mistyped or renamed key raises TypeError.
      # That otherwise happens when a run starts — on real data, after the
      # matrices have loaded. It depends on nothing outside the repository, so
      # every config must pass it.
      #
      # `resolve` additionally expands a sample sheet, which reads a file.
      # config_snakemake.yaml points at the sibling workflow checkout by design,
      # and that is absent here, so resolution is attempted and reported but a
      # missing external sheet is a skip rather than a failure.
      #
      # `validate_inputs()` is called for neither: the matrices it looks for are
      # gitignored and rebuilt from public SRA accessions upstream.
      - name: Every config file resolves into a Config
        run: |
          pixi run -e dev python - <<'PY'
          import sys
          from pathlib import Path
          from screye.config import Config

          root = Path.cwd()
          failures = []
          for path in sorted(root.glob("config/config*.yaml")):
              try:
                  cfg = Config.from_yaml(path)
              except Exception as error:
                  failures.append(f"{path.name}: schema: {type(error).__name__}: {error}")
                  continue

              sheet = cfg.sample_sheet
              external = sheet is not None and not (
                  root / sheet.libraries
              ).resolve().is_relative_to(root)

              if external:
                  print(f"ok  {path.name}: schema valid; sample sheet "
                        f"{sheet.libraries} is outside the repository, "
                        f"resolution skipped")
                  continue

              try:
                  resolved = cfg.resolve(root)
              except Exception as error:
                  failures.append(f"{path.name}: resolve: {type(error).__name__}: {error}")
                  continue

              print(f"ok  {path.name}: {len(resolved.samples)} sample(s), "
                    f"outdir={resolved.outdir.name}, "
                    f"doublet_threshold={resolved.qc.doublet_threshold}")

          if failures:
              print("\nFAILED:", *failures, sep="\n  ")
              sys.exit(1)
          PY

      # The sample sheet is the handover from the upstream workflow. Its 22 rows
      # are the source of truth for which libraries exist and which timepoint
      # each belongs to, so a truncated or reordered sheet would silently change
      # what gets analysed.
      - name: Sample sheet is intact
        run: |
          pixi run -e dev python - <<'PY'
          import csv, sys
          from collections import Counter

          with open("config/libraries.tsv") as handle:
              rows = [r for r in csv.DictReader(handle, delimiter="\t") if r.get("library")]

          counts = Counter(r["timepoint"] for r in rows)
          print(f"{len(rows)} libraries: {dict(counts)}")

          problems = []
          if len(rows) != 22:
              problems.append(f"expected 22 libraries, found {len(rows)}")
          if counts.get("5dpf") != 9 or counts.get("8dpf") != 13:
              problems.append(f"expected 9 at 5dpf and 13 at 8dpf, found {dict(counts)}")
          names = [r["library"] for r in rows]
          if len(set(names)) != len(names):
              problems.append("duplicate library names")

          if problems:
              print("FAILED:", *problems, sep="\n  ")
              sys.exit(1)
          PY
